name: Build and Release batView

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: python3
            setup: brew update && brew install cmake wxwidgets python pkg-config
            build: python3 scripts/build_app.py --no-run
          - os: ubuntu-latest
            python: python3
            setup: sudo apt-get update && sudo apt-get install -y cmake g++ make pkg-config libwxgtk3.2-dev libgtk-3-dev python3 python3-dev python3-pip zip
            build: python3 scripts/build_app.py --no-run
          - os: windows-latest
            python: python
            setup: |
              $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
              if (-not (Test-Path $env:VCPKG_ROOT)) {
                git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
              }
              & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat')
              & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install wxwidgets:x64-windows
              "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
              "BATVIEW_CMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
            build: python scripts/build_app.py --no-run

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.setup }}
        if: runner.os != 'Windows'

      - name: Install dependencies
        shell: pwsh
        run: ${{ matrix.setup }}
        if: runner.os == 'Windows'

      - name: Build package
        shell: bash
        run: ${{ matrix.build }}
        if: runner.os != 'Windows'

      - name: Build package
        shell: pwsh
        run: ${{ matrix.build }}
        if: runner.os == 'Windows'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: batView-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true